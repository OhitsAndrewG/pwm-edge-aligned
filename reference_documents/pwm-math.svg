<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" font-family="Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#fbfbf9}
  .title{font-size:34px;font-weight:700;fill:#1a1a2e}
  .sub{font-size:17px;fill:#5a5a6a}
  .h{font-size:21px;font-weight:700;fill:#1a3a6b}
  .lbl{font-size:15px;fill:#33333f}
  .mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15px;fill:#22222c}
  .monob{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:17px;font-weight:700;fill:#22222c}
  .small{font-size:13px;fill:#6a6a78}
  .accent{fill:#c2410c}
  .box{fill:#ffffff;stroke:#c8c8d4;stroke-width:1.5;rx:6}
  .boxa{fill:#fff4ec;stroke:#e08a52;stroke-width:2;rx:6}
  .rule{stroke:#d8d8e0;stroke-width:1}
  .wave{fill:none;stroke:#1a56b8;stroke-width:2.5;stroke-linejoin:miter}
  .dim{stroke:#c2410c;stroke-width:1.2}
  .dimg{stroke:#8a8a98;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<rect class="bg" width="1400" height="1660"/>

<text class="title" x="60" y="60">PWM Math — how CCR2 sets the pulse width</text>
<text class="sub" x="60" y="90">STM32F411CEU6 · TIM2 channel 2 · PA1 (pin 11, AF1) · hobby servo</text>
<line class="rule" x1="60" y1="108" x2="1340" y2="108"/>

<!-- ============ STEP 1-2 : the chain ============ -->
<text class="h" x="60" y="152">1 · The clock is divided down until one tick = 1 microsecond</text>

<rect class="box" x="60" y="176" width="200" height="66"/>
<text class="mono" x="80" y="203">HSI clock</text>
<text class="monob" x="80" y="228">16 000 000 Hz</text>

<text class="mono" x="284" y="215">÷ (PSC+1)</text>
<text class="small" x="284" y="234">= ÷ 16</text>
<path d="M275 190 L275 190" />
<line x1="270" y1="209" x2="262" y2="209" stroke="#8a8a98" stroke-width="2"/>
<path d="M382 209 l14 0" stroke="#8a8a98" stroke-width="2"/>
<path d="M396 209 l-8 -5 l0 10 z" fill="#8a8a98"/>

<rect class="box" x="410" y="176" width="200" height="66"/>
<text class="mono" x="430" y="203">tick rate</text>
<text class="monob" x="430" y="228">1 000 000 Hz</text>

<path d="M620 209 l24 0" stroke="#8a8a98" stroke-width="2"/>
<path d="M644 209 l-8 -5 l0 10 z" fill="#8a8a98"/>

<rect class="boxa" x="660" y="176" width="230" height="66"/>
<text class="mono" x="680" y="203">one tick lasts</text>
<text class="monob accent" x="680" y="228">1 microsecond</text>

<text class="lbl" x="920" y="200">PSC = 15 is chosen precisely</text>
<text class="lbl" x="920" y="222">so this comes out to 1 µs.</text>
<text class="small" x="920" y="242">Everything below depends on it.</text>

<!-- ============ STEP 3 : the lap ============ -->
<text class="h" x="60" y="300">2 · ARR sets how many ticks are in one lap</text>
<text class="mono" x="60" y="332">counter runs  0, 1, 2 ... 19999  then wraps  →  ARR + 1 = 20 000 ticks</text>
<text class="monob" x="60" y="360">20 000 ticks × 1 µs = 20 000 µs = <tspan class="accent">20 ms period  (50 Hz)</tspan></text>

<!-- ============ STEP 4 : waveforms ============ -->
<text class="h" x="60" y="420">3 · CCR2 splits that lap — the period never changes, only the split</text>

<!-- waveform 1 : 1000us -->
<text class="mono" x="60" y="474">CCR2 = 1000</text>
<text class="small" x="60" y="493">full left</text>
<path class="wave" d="M200 490 L200 452 L255 452 L255 490 L1300 490"/>
<line class="dim" x1="200" y1="504" x2="255" y2="504"/>
<text class="small accent" x="262" y="509">1000 µs high</text>

<!-- waveform 2 : 1500us -->
<text class="mono" x="60" y="574">CCR2 = 1500</text>
<text class="small" x="60" y="593">centre</text>
<path class="wave" d="M200 590 L200 552 L282 552 L282 590 L1300 590"/>
<line class="dim" x1="200" y1="604" x2="282" y2="604"/>
<text class="small accent" x="289" y="609">1500 µs high</text>

<!-- waveform 3 : 2000us -->
<text class="mono" x="60" y="674">CCR2 = 2000</text>
<text class="small" x="60" y="693">full right</text>
<path class="wave" d="M200 690 L200 652 L310 652 L310 690 L1300 690"/>
<line class="dim" x1="200" y1="704" x2="310" y2="704"/>
<text class="small accent" x="317" y="709">2000 µs high</text>

<!-- shared period bracket -->
<line class="dimg" x1="200" y1="440" x2="200" y2="740"/>
<line class="dimg" x1="1300" y1="440" x2="1300" y2="740"/>
<line x1="200" y1="752" x2="1300" y2="752" stroke="#8a8a98" stroke-width="1.4"/>
<text class="lbl" x="700" y="775" text-anchor="middle">identical 20 ms period in all three — drawn to scale</text>

<!-- ============ formulas ============ -->
<text class="h" x="60" y="838">4 · The formulas</text>
<rect class="box" x="60" y="860" width="620" height="150"/>
<text class="mono" x="84" y="894">tick rate     f_tick  = f_timer / (PSC + 1)</text>
<text class="mono" x="84" y="922">period        T       = (ARR + 1) / f_tick</text>
<text class="mono" x="84" y="950">pulse width   t_high  = CCR2 / f_tick</text>
<text class="mono" x="84" y="978">duty cycle    D       = CCR2 / (ARR + 1)</text>

<rect class="boxa" x="710" y="860" width="630" height="150"/>
<text class="monob" x="734" y="892">with PSC = 15 and f_timer = 16 MHz :</text>
<text class="mono" x="734" y="922">f_tick = 1 MHz, so t_tick = 1 µs, therefore</text>
<text class="monob accent" x="734" y="960">t_high (in µs)  =  CCR2</text>
<text class="small" x="734" y="988">CCR2 is literally the pulse width in microseconds. No conversion.</text>

<!-- ============ table ============ -->
<text class="h" x="60" y="1070">5 · Values</text>
<line class="rule" x1="60" y1="1088" x2="900" y2="1088"/>
<text class="mono" x="76"  y="1116">CCR2</text>
<text class="mono" x="240" y="1116">ticks high</text>
<text class="mono" x="430" y="1116">pulse width</text>
<text class="mono" x="620" y="1116">duty</text>
<text class="mono" x="750" y="1116">servo</text>
<line class="rule" x1="60" y1="1130" x2="900" y2="1130"/>
<text class="mono" x="76" y="1160">1000</text><text class="mono" x="240" y="1160">1000</text><text class="mono" x="430" y="1160">1000 µs</text><text class="mono" x="620" y="1160">5.00 %</text><text class="mono" x="750" y="1160">full left</text>
<text class="mono" x="76" y="1190">1250</text><text class="mono" x="240" y="1190">1250</text><text class="mono" x="430" y="1190">1250 µs</text><text class="mono" x="620" y="1190">6.25 %</text><text class="mono" x="750" y="1190">quarter</text>
<text class="mono accent" x="76" y="1220">1500</text><text class="mono accent" x="240" y="1220">1500</text><text class="mono accent" x="430" y="1220">1500 µs</text><text class="mono accent" x="620" y="1220">7.50 %</text><text class="mono accent" x="750" y="1220">centre</text>
<text class="mono" x="76" y="1250">1750</text><text class="mono" x="240" y="1250">1750</text><text class="mono" x="430" y="1250">1750 µs</text><text class="mono" x="620" y="1250">8.75 %</text><text class="mono" x="750" y="1250">three quarter</text>
<text class="mono" x="76" y="1280">2000</text><text class="mono" x="240" y="1280">2000</text><text class="mono" x="430" y="1280">2000 µs</text><text class="mono" x="620" y="1280">10.00 %</text><text class="mono" x="750" y="1280">full right</text>
<line class="rule" x1="60" y1="1296" x2="900" y2="1296"/>
<text class="small" x="60" y="1320">Stay inside 1000–2000. Beyond that most servos drive against a mechanical stop, stall, and overheat.</text>

<!-- ============ counter-example ============ -->
<text class="h" x="960" y="1070">Why PSC = 15 and not 0</text>
<rect class="box" x="960" y="1090" width="380" height="176"/>
<text class="mono" x="982" y="1122">PSC = 0  →  tick = 62.5 ns</text>
<text class="mono" x="982" y="1150">CCR2 = 1500 gives</text>
<text class="mono" x="982" y="1178">1500 × 62.5 ns = 93.75 µs</text>
<text class="small" x="982" y="1206">— not a servo pulse at all.</text>
<text class="mono" x="982" y="1236">You would need CCR2 = 24000</text>
<text class="small" x="982" y="1258">for the same 1500 µs.</text>

<!-- ============ footnote ============ -->
<line class="rule" x1="60" y1="1372" x2="1340" y2="1372"/>
<text class="h" x="60" y="1410">Measured on the bench: 20.30 ms, not 20.00 ms</text>
<text class="lbl" x="60" y="1442">The formulas are exact. The input is not — HSI is an internal RC oscillator, spec'd around ±1%.</text>
<text class="mono" x="60" y="1474">20.30 / 20.00 = 1.015   →   real clock ≈ 15.76 MHz   →   real tick ≈ 1.015 µs</text>
<text class="lbl" x="60" y="1506">So CCR2 = 1500 actually produces ≈ 1522 µs, roughly 4° of servo error.</text>
<text class="lbl" x="60" y="1534">Switching to the 25 MHz crystal + PLL (±20 ppm) removes it: 1500.03 µs.</text>
<text class="small" x="60" y="1566">Everything downstream of f_timer is exact arithmetic. Only the clock source carries error.</text>

<text class="small" x="60" y="1620">pwm_example · reference · RM0383 (registers) + STM32F411xC/E datasheet (pinout)</text>
</svg>
